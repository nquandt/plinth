# CI for Plinth. Every job runs `scripts/ci-local.sh`, the same script that a
# developer runs before a push, so CI and local checks cannot drift apart.
#
# Cost rules (GitHub bills private-repo minutes at 1x on Linux, 2x on
# Windows and 10x on macOS):
# - a newer push to the same branch cancels the run in progress;
# - changes to documentation only do not start CI;
# - macOS runs only by hand (workflow_dispatch) and once a week.
name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC: the weekly macOS run

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# gpui-ce is a path dependency checked out as a sibling directory, pinned to
# a known-good commit (see docs/RELEASING.md for how to update the pin).
env:
  GPUI_CE_REPO: https://github.com/nquandt/gpui-ce
  GPUI_CE_COMMIT: 30572650c80c1975c33bfd66c90ae66ea00ee1cc
  CARGO_BUILD_JOBS: 3

jobs:
  windows:
    name: Windows (full)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - name: Checkout plinth
        uses: actions/checkout@v4
        with:
          path: plinth
      - name: Checkout gpui-ce (sibling, pinned commit)
        uses: actions/checkout@v4
        with:
          repository: nquandt/gpui-ce
          ref: ${{ env.GPUI_CE_COMMIT }}
          path: gpui-ce
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plinth -> target
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: scripts/ci-local.sh full
        working-directory: plinth
        shell: bash
        run: bash scripts/ci-local.sh full

  linux:
    name: Linux (no GUI)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plinth
        uses: actions/checkout@v4
        with:
          path: plinth
      - name: Checkout gpui-ce (sibling, pinned commit)
        uses: actions/checkout@v4
        with:
          repository: nquandt/gpui-ce
          ref: ${{ env.GPUI_CE_COMMIT }}
          path: gpui-ce
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plinth -> target
      # Packages gpui-ce needs to build on Linux (from gpui-ce's own CI).
      - name: Install system packages for gpui-ce
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig-dev
      - name: scripts/ci-local.sh nogui
        working-directory: plinth
        run: bash scripts/ci-local.sh nogui

  macos:
    name: macOS (no GUI, weekly or by hand)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout plinth
        uses: actions/checkout@v4
        with:
          path: plinth
      - name: Checkout gpui-ce (sibling, pinned commit)
        uses: actions/checkout@v4
        with:
          repository: nquandt/gpui-ce
          ref: ${{ env.GPUI_CE_COMMIT }}
          path: gpui-ce
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plinth -> target
      - name: scripts/ci-local.sh nogui
        working-directory: plinth
        run: bash scripts/ci-local.sh nogui
