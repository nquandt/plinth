# CI for Plinth. Every job runs `scripts/ci-local.sh`, the same script that a
# developer runs before a push, so CI and local checks cannot drift apart.
#
# Cost rules (GitHub bills private-repo minutes at 1x on Linux, 2x on
# Windows and 10x on macOS):
# - a newer push to the same branch cancels the run in progress;
# - changes to documentation only do not start CI;
# - macOS runs only by hand (workflow_dispatch) and once a week.
# Windows and Linux run on self-hosted runners on the owner's PC (no
# minutes; infra/self-hosted-runner/README.md): Windows as a persistent
# service (the build output stays warm), Linux as an ephemeral loop in WSL.
# Only macOS uses GitHub-hosted minutes.
name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC: the weekly macOS run

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# gpui-ce is a path dependency checked out as a sibling directory, pinned to
# a known-good commit (see docs/RELEASING.md for how to update the pin).
env:
  GPUI_CE_REPO: https://github.com/nquandt/gpui-ce
  GPUI_CE_COMMIT: 30572650c80c1975c33bfd66c90ae66ea00ee1cc
  CARGO_BUILD_JOBS: 3

jobs:
  windows:
    name: Windows (full)
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Windows, plinth]
    steps:
      # clean: false keeps target/ between runs on this persistent runner
      # (a clean checkout runs `git clean -ffdx`, which deletes it).
      - name: Checkout plinth
        uses: actions/checkout@v4
        with:
          path: plinth
          clean: false
      - name: Checkout gpui-ce (sibling, pinned commit)
        uses: actions/checkout@v4
        with:
          repository: nquandt/gpui-ce
          ref: ${{ env.GPUI_CE_COMMIT }}
          path: gpui-ce
          clean: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: scripts/ci-local.sh full
        working-directory: plinth
        shell: bash
        run: bash scripts/ci-local.sh full

  # The app suites on the wasmi interpreter, the iOS engine (PRODUCTION Q4,
  # `ci-local.sh wasmi`, about 6 min with a warm build). Only on a push to
  # master and by hand, not on each pull request: the runner is the owner's
  # PC. It runs after the Windows job on the same persistent runner, so it
  # uses the warm build output and does not run at the same time.
  wasmi:
    name: Windows (wasmi engine)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: windows
    runs-on: [self-hosted, Windows, plinth]
    steps:
      - name: Checkout plinth
        uses: actions/checkout@v4
        with:
          path: plinth
          clean: false
      - name: Checkout gpui-ce (sibling, pinned commit)
        uses: actions/checkout@v4
        with:
          repository: nquandt/gpui-ce
          ref: ${{ env.GPUI_CE_COMMIT }}
          path: gpui-ce
          clean: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: scripts/ci-local.sh wasmi
        working-directory: plinth
        shell: bash
        run: bash scripts/ci-local.sh wasmi

  linux:
    name: Linux (no GUI)
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, plinth]
    steps:
      - name: Checkout plinth
        uses: actions/checkout@v4
        with:
          path: plinth
      - name: Checkout gpui-ce (sibling, pinned commit)
        uses: actions/checkout@v4
        with:
          repository: nquandt/gpui-ce
          ref: ${{ env.GPUI_CE_COMMIT }}
          path: gpui-ce
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plinth -> target
      # The packages that gpui-ce needs on Linux are installed on the runner
      # one time (a job has no sudo): libxkbcommon-dev libxkbcommon-x11-dev
      # libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev
      # libfontconfig-dev (infra/self-hosted-runner/README.md).
      - name: scripts/ci-local.sh nogui
        working-directory: plinth
        run: bash scripts/ci-local.sh nogui
      # Dependency audit (deny.toml, docs/DEPENDENCIES.md). install-action
      # downloads a prebuilt cargo-deny into ~/.cargo/bin (no sudo, no
      # build). It runs after the tests, so a new advisory does not hide a
      # test result; `!cancelled()` runs it also when the tests fail.
      - name: Install cargo-deny
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: scripts/ci-local.sh deny
        if: ${{ !cancelled() }}
        working-directory: plinth
        run: bash scripts/ci-local.sh deny

  macos:
    name: macOS (no GUI, weekly or by hand)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout plinth
        uses: actions/checkout@v4
        with:
          path: plinth
      - name: Checkout gpui-ce (sibling, pinned commit)
        uses: actions/checkout@v4
        with:
          repository: nquandt/gpui-ce
          ref: ${{ env.GPUI_CE_COMMIT }}
          path: gpui-ce
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plinth -> target
      - name: scripts/ci-local.sh nogui
        working-directory: plinth
        run: bash scripts/ci-local.sh nogui
