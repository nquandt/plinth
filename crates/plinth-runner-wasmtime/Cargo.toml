[package]
name = "plinth-runner-wasmtime"
description = "Runs Plinth app components with wasmtime (desktop and Android)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
wasmtime = { workspace = true, optional = true }
plinth-protocol.workspace = true
plinth-link.workspace = true
serde.workspace = true
serde_json = "1"
sha2.workspace = true
ureq.workspace = true
wasmi = { version = "2.0.0", optional = true }
wasmparser = { workspace = true, optional = true }
wasmi_core = { version = "2.0.0", optional = true }
# `store.sql` (docs/SQL.md): SQLite, compiled from source (`bundled`, with
# FTS5), so every desktop and mobile host has the same SQLite version.
# `hooks` gives the authorizer and the progress handler; `limits` gives
# `set_limit`.
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "limits"] }
# `plinth:locale` (docs/I18N.md §3.1): the OS locale as a BCP 47 tag
# (Windows `GetUserDefaultLocaleName`, macOS `CFLocale`, Linux `LANG`).
sys-locale = "0.3.2"
# `plinth:locale` formatting (docs/I18N.md §3.7): ICU4X 2.x with its
# compiled data for all locales (Unicode-3.0). `icu_experimental` gives the
# currency and percent formatters (not in a stable ICU4X crate yet).
icu_locale_core = "2.3.0"
icu_decimal = "2.3.0"
icu_datetime = "2.3.0"
icu_calendar = "2.3.0"
icu_time = "2.3.0"
icu_plurals = "2.3.0"
icu_list = "2.3.0"
icu_collator = "2.3.1"
icu_experimental = "0.6.0"
fixed_decimal = { version = "0.7.2", features = ["ryu"] }
writeable = "0.6.4"

# The local time zone offset (`plinth:time` `timezone-offset`). `time` with
# `local-offset` uses `num_threads`, which does not build for iOS (libc has
# no `mach_task_self` there), so iOS reads the offset with `localtime_r`.
[target.'cfg(not(target_os = "ios"))'.dependencies]
time = { version = "0.3.55", default-features = false, features = ["std", "local-offset"] }

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"

[features]
# `wasmtime` is the desktop and Android engine (on by default). An iOS build
# turns it off (`--no-default-features --features wasmi`): wasmtime needs a
# JIT, which iOS does not allow (PRODUCTION R5, docs/MAC-HANDOFF.md §5).
default = ["wasmtime"]
wasmtime = ["dep:wasmtime"]
# The wasmi interpreter engine (SPEC.md §9.2), for iOS and tests. Pulls in
# wasmparser to pull the linked core module out of the component, and
# wasmi_core directly for `LimiterError` (the memory cap's `Limiter`),
# which wasmi itself does not re-export.
wasmi = ["dep:wasmi", "dep:wasmparser", "dep:wasmi_core"]

[dev-dependencies]
wat = "1.261.0"
