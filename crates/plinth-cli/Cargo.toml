[package]
name = "plinth-cli"
description = "The plinth command-line tool: new, check, build, dev, run"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "plinth"
path = "src/main.rs"

# `plinthw`: runs `plinth` with no console window, for shortcuts and
# plinth:// links on Windows (`docs/HUB.md` §10).
[[bin]]
name = "plinthw"
path = "src/plinthw.rs"

[features]
# `plinth test` on the wasmi interpreter (docs/TESTING.md §11; set
# `PLINTH_ENGINE=wasmi`). Off by default: a debug build of wasmi is slow.
wasmi = ["plinth-runner-wasmtime/wasmi"]

[dependencies]
plinth-compiler.workspace = true
plinth-package.workspace = true
plinth-host-desktop.workspace = true
plinth-protocol.workspace = true
plinth-hub.workspace = true
plinth-registry.workspace = true
plinth-link.workspace = true
anyhow.workspace = true
base64.workspace = true
wit-component.workspace = true
wasmparser.workspace = true
sha2.workspace = true
wasm-opt.workspace = true
# `plinth test` (docs/TESTING.md): the runner and the UI tree, with no window.
plinth-runner-wasmtime.workspace = true
plinth-ui.workspace = true

[dev-dependencies]
# `tests/uninstall_export.rs` reads the export zip and its manifest.
zip.workspace = true
serde_json.workspace = true
