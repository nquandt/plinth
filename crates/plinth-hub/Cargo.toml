# The `plinth://` scheme registration (`src/os.rs`, `docs/HUB.md` §10).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
plinth-compiler = { workspace = true }
toml = { workspace = true }
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
