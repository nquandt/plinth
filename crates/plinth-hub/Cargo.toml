[package]
name = "plinth-hub"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
plinth-package = { workspace = true }
plinth-link = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
plinth-runner-wasmtime = { workspace = true }
# Export of the app data (`src/appdata.rs`, `docs/STORAGE.md` S13): the zip file,
# and `VACUUM INTO` for a consistent copy of the SQL database. The same
# `rusqlite` as `plinth-runner-wasmtime`, so the build has one SQLite.
zip = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }

# The `plinth://` scheme registration (`src/os.rs`, `docs/HUB.md` §10).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# `.lnk` shortcuts through the shell's `IShellLinkW` (`src/os.rs`).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
plinth-compiler = { workspace = true }
toml = { workspace = true }
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
