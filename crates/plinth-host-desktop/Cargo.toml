[package]
name = "plinth-host-desktop"
description = "The Plinth desktop host for Windows, macOS and Linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "plinth-host"
path = "src/main.rs"

[dependencies]
plinth-ui.workspace = true
plinth-runner-wasmtime.workspace = true
plinth-package.workspace = true
plinth-link.workspace = true
plinth-protocol.workspace = true
plinth-hub.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
arboard = { version = "3", default-features = false }
ureq.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
# `plinth:secrets` (src/secrets.rs): the system keychain. `v1` selects the
# native store of each platform: Windows Credential Manager, macOS Keychain,
# Linux Secret Service. No other store is on.
keyring = { version = "4.2", default-features = false, features = ["v1"] }
# The `target` modifier of a Windows entry (the entry type of `keyring` has no
# constructor with modifiers). `keyring` already needs this crate.
keyring-core = "1"

# `plinth:notify` on Windows (src/notify.rs): WinRT toasts. The same
# versions as gpui-ce uses, so no new crate comes into the build.
[target.'cfg(windows)'.dependencies]
# The system settings (src/system_settings.rs, PRODUCTION U7): high
# contrast, its colors and "Animation effects".
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Graphics_Gdi", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6"

[dev-dependencies]
plinth-protocol.workspace = true
plinth-compiler.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
wat = "1"
# `TestAppContext` (a test platform with no GPU and no real windows), for
# the Hub launch poll loop test (`tests/hub_host.rs`).
gpui = { workspace = true, features = ["test-support"] }
plinth-ui.workspace = true
# A tiny real HTTP server for the updater's integration test
# (`tests/updater_http.rs`), reusing `plinth registry serve`'s server.
plinth-registry.workspace = true
