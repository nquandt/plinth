[package]
name = "plinth-host-desktop"
description = "The Plinth desktop host for Windows, macOS and Linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "plinth-host"
path = "src/main.rs"

[dependencies]
plinth-ui.workspace = true
plinth-runner-wasmtime.workspace = true
plinth-package.workspace = true
plinth-link.workspace = true
plinth-protocol.workspace = true
plinth-hub.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
arboard = { version = "3", default-features = false }

[dev-dependencies]
plinth-protocol.workspace = true
wat = "1"
