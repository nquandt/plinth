<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plinth Hub</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* The web App Hub shell (docs/web-hub.md): the Hub app renders in
         #app like any app; these rules are only for the host dialogs (the
         consent window and the app window). Colors come from style.css. */
      :root {
        --host-warn: #f0b429;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --host-warn: #7a4d00;
        }
      }
      .host-dialog,
      .host-window {
        background: var(--pl-bg);
        color: var(--pl-text);
        border: 1px solid var(--pl-border);
        border-radius: 12px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.45;
      }
      .host-dialog {
        width: min(560px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        box-sizing: border-box;
        padding: 16px 20px;
      }
      .host-dialog::backdrop,
      .host-window::backdrop {
        background: rgb(0 0 0 / 0.55);
      }
      .host-dialog h2 {
        font-size: 1.2rem;
        margin: 0 0 8px;
      }
      .host-meta {
        color: var(--pl-muted);
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }
      .host-caps {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .host-cap {
        background: var(--pl-surface);
        border: 1px solid var(--pl-border);
        border-radius: 8px;
        padding: 8px 12px 10px;
        margin: 0;
        min-width: 0;
      }
      .host-cap legend {
        padding: 0 4px;
      }
      .host-cap p {
        margin: 4px 0 0;
      }
      .host-cap-title {
        font-weight: 600;
      }
      .host-code {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.85rem;
        color: var(--pl-muted);
      }
      .host-chip {
        border: 1px solid var(--pl-border);
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      .host-risk-medium {
        border-color: var(--host-warn);
        color: var(--host-warn);
      }
      .host-risk-high {
        border-color: var(--pl-danger);
        color: var(--pl-danger);
      }
      .host-choices {
        display: flex;
        gap: 24px;
        margin: 8px 0 0;
      }
      .host-choices label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        cursor: pointer;
      }
      .host-choices input {
        width: 18px;
        height: 18px;
        accent-color: var(--pl-accent);
      }
      .host-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        margin: 16px 0 0;
      }
      .host-button {
        font: inherit;
        border-radius: 8px;
        padding: 8px 16px;
        cursor: pointer;
        background: var(--pl-surface);
        color: var(--pl-text);
        border: 1px solid var(--pl-border);
      }
      .host-input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid var(--pl-border);
        background: var(--pl-surface);
        color: var(--pl-text);
      }
      .host-primary {
        background: var(--pl-accent);
        color: var(--pl-accent-text);
        border-color: var(--pl-accent);
        font-weight: 600;
      }
      .host-window {
        position: fixed;
        inset: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 0 0 100vmax rgb(0 0 0 / 0.55);
      }
      .host-window-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 8px 6px 16px;
        border-bottom: 1px solid var(--pl-border);
        background: var(--pl-surface);
      }
      .host-window-bar h2 {
        font-size: 1.05rem;
        margin: 0;
      }
      .host-window-bar .host-button {
        margin-left: auto;
      }
      .host-frame {
        flex: 1;
        width: 100%;
        min-height: 0;
        border: 0;
        background: var(--pl-bg);
      }
      .host-error {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 16px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* The Hub app runs in its own sandboxed frame, over the whole page. */
      #hub-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .host-visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <!-- The Hub UI is the Plinth app examples/hub; hub-shell.js loads it
         from the registry and runs it in a sandboxed frame with the
         plinth:hub backend (docs/web-hub.md). -->
    <div id="app"><p style="padding: 24px">Loading the Hub&hellip;</p></div>
    <div class="host-visually-hidden" id="host-status" role="status" aria-live="polite"></div>
    <script type="module" src="hub-shell.js"></script>
  </body>
</html>
