[workspace]
resolver = "3"
members = [
  "crates/plinth-protocol",
  "crates/plinth-ui",
  "crates/plinth-runner-wasmtime",
  "crates/plinth-host-desktop",
  "crates/plinth-cli",
  "crates/plinth-guest",
  "crates/plinth-rt",
  "crates/plinth-compiler",
  "crates/plinth-link",
  "crates/plinth-package",
  "crates/plinth-shoot",
  "crates/plinth-hub",
  "crates/plinth-registry",
  "examples/counter-rs",
  "examples/todo-rs",
]
# Guest crates build only for wasm32-unknown-unknown (see `plinth example`).
default-members = [
  "crates/plinth-protocol",
  "crates/plinth-ui",
  "crates/plinth-runner-wasmtime",
  "crates/plinth-host-desktop",
  "crates/plinth-cli",
  "crates/plinth-compiler",
  "crates/plinth-link",
  "crates/plinth-package",
  "crates/plinth-hub",
  "crates/plinth-registry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
plinth-protocol = { path = "crates/plinth-protocol", version = "0.1.0" }
plinth-ui = { path = "crates/plinth-ui", version = "0.1.0" }
plinth-runner-wasmtime = { path = "crates/plinth-runner-wasmtime", version = "0.1.0" }
plinth-guest = { path = "crates/plinth-guest", version = "0.1.0" }
plinth-compiler = { path = "crates/plinth-compiler", version = "0.1.0" }
plinth-link = { path = "crates/plinth-link", version = "0.1.0" }
plinth-package = { path = "crates/plinth-package", version = "0.1.0" }
plinth-hub = { path = "crates/plinth-hub", version = "0.1.0" }
plinth-registry = { path = "crates/plinth-registry", version = "0.1.0" }
plinth-host-desktop = { path = "crates/plinth-host-desktop", version = "0.1.0" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "46.0.3", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "parallel-compilation", "addr2line", "anyhow"] }
wit-bindgen = { version = "0.57.1", default-features = false, features = ["macros", "realloc"] }
wit-component = "0.251"
wasmparser = "0.251"
wasm-encoder = "0.251"
# Binaryen's optimizer, built into `plinth` for `plinth build --release`
# (SPEC.md §5.1 step 10). No `dwarf` feature: app modules carry no DWARF.
wasm-opt = { version = "0.116.1", default-features = false }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10.9"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
gpui = { path = "../gpui-ce/crates/gpui", package = "gpui-ce", version = "0.2" }
gpui_platform = { path = "../gpui-ce/crates/gpui_platform", package = "gpui_ce_platform", version = "0.1" }
gpui_elements = { path = "../gpui-ce/crates/gpui_elements", package = "gpui_ce_elements", version = "0.1" }

# Small debug builds: gpui and wasmtime with full debug info take tens of GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# wasmi interprets plinth-rt's own bytecode, so an unoptimized wasmi is
# much slower than wasmtime's compiled code even for a short test. The
# three sub-crates that do the actual work (decode the bytecode, run the
# numeric ops) get full optimization, so `cargo test` with `PLINTH_ENGINE
# =wasmi` stays fast, without paying for an optimized build of everything
# else. `wasmi` itself stays at opt-level 0: opt-level 3 there crashes
# (STATUS_ACCESS_VIOLATION) in a dev build on Windows/MSVC, reproduced
# with debug-assertions and overflow-checks off too, so it is not those;
# it is specific to optimizing the `wasmi` crate's own code at this
# opt-level outside a full `release` profile. `wasmi` itself is mostly
# glue (`Store`, `Linker`, `Caller`) around the three sub-crates, so this
# still gets most of the speedup.
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
[profile.dev.package.wasmi_collections]
opt-level = 3

# Binaryen (C++, built by the `wasm-opt-sys` build script) follows the
# opt-level of its crate. At opt-level 0, `plinth build --release` of a
# debug `plinth` spends about 0.5 s in the optimizer for the Hub app.
[profile.dev.package.wasm-opt-sys]
opt-level = 3

[profile.release]
lto = "thin"

[profile.wasm]
inherits = "release"
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true
