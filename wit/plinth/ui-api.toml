# UI API id table (SPEC.md §8.2).
#
# This file is the single source of truth for control kind, prop, event and
# enum ids. The compiler, the guest runtime and the host all generate their
# constants from it. Never reuse or renumber an id inside one major version.

version = "1.2"

[controls]
screen = 1
section = 2
text = 3
heading = 4
button = 5
text-field = 6
toggle = 7
list = 8
row = 9
empty = 10
group = 11       # UI API 1.1
tabs = 20        # UI API 1.2
sheet = 21        # UI API 1.2
dialog = 22        # UI API 1.2
menu = 23        # UI API 1.2
grid = 24        # UI API 1.2
action = 25        # UI API 1.2 (a value, surfaced to the host as a child node)

[props]
title = 1        # string
subtitle = 2     # string
label = 3        # string
value = 4        # string (text-field, tabs) | bool (toggle, sheet/dialog "open")
placeholder = 5  # string
role = 6         # enum button-role
style = 7        # enum text-style
tone = 8         # enum tone
level = 9        # int (1..=3)
disabled = 10    # bool
icon = 11        # string, a name from the runtime icon set
message = 12     # string
footer = 13      # string
error = 14       # string
axis = 15        # enum axis (1.1)
size = 16        # enum button-size (1.1)
align = 17       # enum text-align (1.1)
items = 30        # string, items joined with U+0001 (tabs, UI API 1.2)
confirm = 31        # bool, default true for a destructive action (UI API 1.2)

[events]
press = 1        # value: null
change = 2       # value: the new value
submit = 3       # value: the current value
close = 6        # value: null (sheet onClose; UI API 1.2)

[enums.button-role]
default = 0
primary = 1
destructive = 2

[enums.text-style]
body = 0
caption = 1
mono = 2

[enums.axis]
auto = 0
row = 1
column = 2

[enums.button-size]
default = 0
large = 1

[enums.text-align]
start = 0
center = 1
end = 2

[enums.tone]
default = 0
muted = 1
danger = 2
success = 3
