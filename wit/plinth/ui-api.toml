# UI API id table (SPEC.md §8.2).
#
# This file is the single source of truth for control kind, prop, event and
# enum ids. The compiler, the guest runtime and the host all generate their
# constants from it. Never reuse or renumber an id inside one major version.

version = "1.10"

[controls]
screen = 1
section = 2
text = 3
heading = 4
button = 5
text-field = 6
toggle = 7
list = 8
row = 9
empty = 10
group = 11       # UI API 1.1
checkbox = 12    # UI API 1.2
text-area = 13   # UI API 1.2
slider = 14      # UI API 1.2
number-field = 15 # UI API 1.2
picker = 16      # UI API 1.2
progress = 17    # UI API 1.2
badge = 18       # UI API 1.2
tabs = 20        # UI API 1.2
sheet = 21        # UI API 1.2
dialog = 22        # UI API 1.2
menu = 23        # UI API 1.2
grid = 24        # UI API 1.2
action = 25        # UI API 1.2 (a value, surfaced to the host as a child node)
image = 26         # UI API 1.3
icon = 27          # UI API 1.4 (Icon as a control, SPEC.md §6.3)
date-picker = 28   # UI API 1.4 (SPEC.md §6.3)
chart = 29         # UI API 1.5 (SPEC.md §6.3)
# UI API 1.6: Level 2 styled primitives (docs/UI-ADVANCED.md, phase U1).
box = 30           # a layout box: flex direction, gap, padding, size, token colors
span = 31          # styled text
pressable = 32     # a box that is a button or a link (label and onPress required)
scroll = 33        # a box that scrolls along its direction
canvas = 34        # UI API 1.10: shapes in a view space that scales to the box (U4)

[props]
title = 1        # string
subtitle = 2     # string
label = 3        # string
value = 4        # string (text-field, tabs) | bool (toggle, sheet/dialog "open")
placeholder = 5  # string
role = 6         # enum button-role
style = 7        # enum text-style
tone = 8         # enum tone
level = 9        # int (1..=3)
disabled = 10    # bool
icon = 11        # string, a name from the runtime icon set
message = 12     # string
footer = 13      # string
error = 14       # string
axis = 15        # enum axis (1.1)
size = 16        # enum button-size (1.1)
align = 17       # enum text-align (1.1)
min = 18         # number (1.2)
max = 19         # number (1.2)
step = 20        # number (1.2)
options = 21     # string, options joined with U+001F (1.2)
items = 30       # string, items joined with U+001F (tabs, 1.2)
confirm = 31     # bool, default true for a destructive action (UI API 1.2)
src = 32         # string, an asset path under assets/ (image, UI API 1.3)
alt = 33         # string, non-empty accessible description (image, UI API 1.3)
aspect = 34      # enum aspect (image, UI API 1.3)
trailing = 35    # string, a muted value shown on the right of a row (row, UI API 1.4)
mode = 36        # enum date-picker-mode (date-picker, UI API 1.4)
chart-kind = 37  # enum chart-kind (chart, UI API 1.5)
data = 38        # string, "label\u0001value" pairs joined with U+001F: one series (chart, UI API 1.5)
series = 39      # string, named series joined with U+001E, each "name\u0001points" (chart, UI API 1.5)
# UI API 1.6, Level 2 style props. Spaces and sizes are in spacing units
# (one unit is 4 px on every host); a size can instead be a fraction.
wrap = 40              # bool
gap = 41               # int, spacing units
padding = 42           # int, spacing units (all sides)
padding-x = 43         # int, spacing units (left and right)
padding-y = 44         # int, spacing units (top and bottom)
cross-align = 45       # enum cross-align (the children across the direction)
justify = 46           # enum justify (the children along the direction)
grow = 47              # int, the flex grow factor of this element in its parent box
width = 48             # int, spacing units
width-fraction = 49    # enum fraction
height = 50            # int, spacing units
height-fraction = 51   # enum fraction
max-width = 52         # int, spacing units
max-width-fraction = 53 # enum fraction
max-height = 54        # int, spacing units
max-height-fraction = 55 # enum fraction
bg = 56                # enum color (a theme token)
fg = 57                # enum color (a theme token)
border = 58            # enum color (a theme token; none = no border)
radius = 59            # enum radius
text-size = 60         # enum text-size
weight = 61            # enum weight
italic = 62            # bool
mono = 63              # bool
lines = 64             # int, the most lines of a span (0 = no limit)
# UI API 1.7, Level 2 partial styles (phase U2). Each is a string of
# "<prop id>:<int value>" pairs joined with ",", made by the compiler from an
# object literal of style props; the host applies it over the props.
hover = 65             # string, partial style while the pointer is over the element
active = 66            # string, partial style while the element is pressed
focus = 67             # string, partial style while the element has keyboard focus
compact = 68           # string, partial style in the compact width class
regular = 69           # string, partial style in the regular width class
wide = 70              # string, partial style in the wide width class
# UI API 1.8 (docs/GAPS.md 7G-1, 7G-2): `disabled` (prop 10) also on
# text-field, text-area and date-picker; `selected` on row.
selected = 71          # bool, a row is the selected one of its list
# UI API 1.9 (docs/GAPS.md G1): positioning of Level 2 boxes. An absolute
# box leaves the flow and is placed in its parent primitive by the insets.
position = 72          # enum position
top = 73               # int, spacing units from the top of the parent
left = 74              # int, spacing units from the left of the parent
right = 75             # int, spacing units from the right of the parent
bottom = 76            # int, spacing units from the bottom of the parent
# UI API 1.10, Canvas (docs/UI-ADVANCED.md U4). The shapes use their own
# coordinate space (view-width x view-height); the canvas keeps its aspect
# ratio and scales the space to its width.
view-width = 77        # int, the width of the view space
view-height = 78       # int, the height of the view space
shapes = 79            # string: shapes joined with U+001E; each shape is fields
                       # joined with U+001F: "r" x y w h color | "c" cx cy r color |
                       # "l" x1 y1 x2 y2 color width | "t" x y color size text
                       # (colors are token names such as "accent" or "text.muted")

[events]
press = 1        # value: null
change = 2       # value: the new value
submit = 3       # value: the current value
close = 6        # value: null (sheet onClose; UI API 1.2)
key-down = 7     # value: the key name (UI API 1.9, Level 2 boxes; no repeats)
key-up = 8       # value: the key name (UI API 1.9)

[enums.button-role]
default = 0
primary = 1
destructive = 2

[enums.text-style]
body = 0
caption = 1
mono = 2

[enums.axis]
auto = 0
row = 1
column = 2

[enums.button-size]
default = 0
large = 1

[enums.text-align]
start = 0
center = 1
end = 2

[enums.tone]
default = 0
muted = 1
danger = 2
success = 3

[enums.aspect]
square = 0
wide = 1
tall = 2

[enums.date-picker-mode]
date = 0
time = 1
datetime = 2

[enums.chart-kind]
bar = 0
line = 1
pie = 2

# UI API 1.6 (Level 2). In TypeScript, the fractions are "auto", "full",
# "1/2", "1/3", "2/3", "1/4", "3/4"; the text sizes "xs" ... "2xl"; the colors
# "background", "surface", "surface.alt", "accent", "danger", "success",
# "text", "text.muted", "on.accent", "border", "hover", "selected".
[enums.cross-align]
stretch = 0
start = 1
center = 2
end = 3

[enums.justify]
start = 0
center = 1
end = 2
between = 3

[enums.fraction]
none = 0
auto = 1
full = 2
half = 3
third = 4
two-thirds = 5
quarter = 6
three-quarters = 7

[enums.color]
none = 0
background = 1
surface = 2
surface-alt = 3
accent = 4
danger = 5
success = 6
text = 7
text-muted = 8
on-accent = 9
border = 10
hover = 11
selected = 12

[enums.radius]
none = 0
sm = 1
md = 2
lg = 3
full = 4

[enums.text-size]
sm = 0
xs = 1
md = 2
lg = 3
xl = 4
xxl = 5

[enums.weight]
regular = 0
medium = 1
semibold = 2
bold = 3

[enums.pressable-role]
button = 0
link = 1

[enums.position]
relative = 0
absolute = 1
